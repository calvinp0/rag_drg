# Failure signatures of ESS output files, used by `rag-drg diagnose` / the `diagnose_output` MCP tool
# (rag_drg/tools/diagnose.py) and indexed for search (one chunk per entry).
#
# Fields per entry:
#   software   gaussian | orca | qchem | molpro | psi4 | pyscf | scheduler (scheduler messages are checked for
#              every program, e.g. a Slurm walltime line in a merged stdout file)
#   id         unique, stable
#   pattern    Python `re` pattern, searched in the output text (use (?m) for ^/$; \s* spans line breaks)
#   meaning    what went wrong (paraphrased)
#   fixes      ordered list, most promising first. "(ARC ...)" lines describe what ARC's troubleshooter does.
#   sources    where the entry comes from (see below)
#   links      optional, Gaussian only: links (l502, l9999, ...) in which the message is fatal; the failing link is
#              read from "Error termination via Lnk1e in .../lNNN.exe" and entries for other links rank lower
#   priority   optional, default 50; higher wins. <= 0 means fallback, used only if nothing else matched
#   severity   optional: error (default; only checked when the job did not terminate normally),
#              fatal (checked even after a normal-termination marker and turns the status to failed),
#              warning (reported, never changes the status)
#   versions   optional list of program versions the entry is limited to
#
# Sources:
#   arc:...     ReactionMechanismGenerator/ARC, commit d9f47ab9 (MIT License); arc/job/trsh.py unless another
#               file is named; the number is the line in that file.
#   wongzit     https://wongzit.github.io/gaussian-common-errors-and-solutions/ (no license): meanings and fixes
#               are PARAPHRASED; only literal Gaussian output strings are reproduced. That page credits the Alliance
#               Canada wiki "Gaussian error messages" page and liyuanhe211/Solution_for_Every_Gaussian_Error_Message.
#   psi4:...    psi4/psi4 on GitHub (master, Sep 2026). slurm:... SchedMD/slurm on GitHub (master, Sep 2026).
#
# Everything here is status: draft until a group member checks it. Add an entry together with a short output
# excerpt under tests/fixtures/outputs/ (see docs/diagnose.md).
meta:
  title: ESS error messages and fixes
  domain: ess
  doc_type: gotcha
  status: draft
  tags:
  - error
  - error termination
  - troubleshooting
  - failed job
  - diagnose
  - gaussian
  - orca
  - qchem
  - molpro
  - psi4
  - slurm
  - link
  - l9999
  - l502
  - convergence

errors:

  # ====================================================================================================
  # GAUSSIAN
  # ====================================================================================================
  - software: gaussian
    id: g-qperr-syntax
    pattern: QPErr --- (?:A syntax error|An ambiguous keyword) was detected in the input
    links:
    - l1
    meaning: The route section contains an unknown keyword, a bad option or a syntax error; Gaussian marks the offending
      position with an apostrophe under the echoed route line. Terminates in l1.
    fixes:
    - Correct the keyword/syntax at the marked position in the route section.
    - '(ARC) The ''Syntax'' label makes the job adapter raise JobError (arc/job/adapter.py:1062): no retry. Check
      the level-of-theory spelling and ARC''s Gaussian input template.'
    sources:
    - arc:trsh.py:determine_ess_status:218
    - wongzit
    - arc:job/adapter.py:1062

  - software: gaussian
    id: g-illegal-itype-mstype
    pattern: Illegal IT(?:py|yp)e or MSType generated by parse
    meaning: Mutually incompatible job types were requested on the route line (e.g. sp together with freq).
    fixes:
    - Remove the conflicting job-type keyword so the route line requests a legal combination.
    sources:
    - wongzit

  - software: gaussian
    id: g-ntrex1-path
    pattern: (?m)^\s*ntrex1\b
    meaning: Gaussian could not open a file named in the input (typically the %chk path), e.g. because the directory
      is wrong or inaccessible.
    fixes:
    - Fix the %chk (or other file) path so it points to an existing, writable location.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-input-error
    pattern: Error termination via Lnk1e in \S*l101\.exe
    links:
    - l101
    priority: 20
    meaning: Generic input-parsing failure in l101 (ARC label 'InputError'/'GL101'); ARC attributes it to a missing
      blank line after the coordinates or a wrong charge/multiplicity line. See the more specific l101 entries below.
    fixes:
    - Inspect the lines just above the termination message and fix the molecule specification.
    - (ARC) No dedicated fix; its generic retry adds int=(Acc2E=14), which does not address input errors.
    sources:
    - arc:trsh.py:determine_ess_status:118
    - arc:parser/adapters/gaussian.py:logfile_contains_errors:129

  - software: gaussian
    id: g-l101-eof-in-zsymb
    pattern: End of file in ZSymb
    links:
    - l101
    meaning: The geometry section could not be found or ended unexpectedly, usually because the terminating blank
      line after the coordinates is missing, or because the geometry was meant to come from the checkpoint but geom=check
      was omitted.
    fixes:
    - Add a blank line after the last coordinate line.
    - If the structure should be read from the .chk, add geom=check.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-charge-mult-missing
    pattern: Wanted an integer as input\.\s*\n\s*Found a string as input\.|End of file in GetChg
    links:
    - l101
    meaning: Gaussian expected the integer charge/multiplicity line but read text (or hit end of file); the charge/multiplicity
      line or, with geom=modify, the title line is missing so lines are shifted.
    fixes:
    - Add the missing charge/multiplicity line (and the title line if it was dropped).
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-no-atoms
    pattern: There are no atoms in this input structure
    links:
    - l101
    meaning: The molecule specification section is empty or absent.
    fixes:
    - Add the molecule specification, or add geom=check if the geometry should come from the checkpoint.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-symbol-not-in-zmatrix
    pattern: Symbol "[^"]*" not found in Z-matrix
    links:
    - l101
    meaning: A variable name listed in the variables section does not occur in the Z-matrix.
    fixes:
    - Correct the variable name, or add it to the Z-matrix.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-variable-index-out-of-range
    pattern: Variable index of\s+\d+ on card\s+\d+ is out of range
    links:
    - l101
    meaning: A Z-matrix line references a variable that was never defined in the variables list (the card number identifies
      the atom line).
    fixes:
    - Define the missing variable.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-unknown-center
    pattern: (?m)^\s*Unknown center\s+\S+
    links:
    - l101
    meaning: A Z-matrix line defines an atom relative to a reference atom label that does not exist.
    fixes:
    - Fix the reference atom label/number in the Z-matrix.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-redefine-unrecognized-symbol
    pattern: Attempt to redefine unrecognized symbol "[^"]*"
    links:
    - l101
    meaning: With geom=modify, a variable being changed is not present in the geometry stored in the checkpoint file.
    fixes:
    - Point to the correct checkpoint file, or change the variable name to one that exists.
    sources:
    - wongzit

  - software: gaussian
    id: g-l101-redcar-gtrans
    pattern: RedCar/ORedCr failed for GTrans
    links:
    - l101
    meaning: Seen in QST2 transition-state searches; usually the reactant and product structures are numbered differently,
      occasionally an internal program problem.
    fixes:
    - Make atom ordering identical in reactant and product inputs.
    - If ordering is correct and it persists, switch to opt=QST3 or a Berny TS search (opt=(TS,calcfc)).
    sources:
    - wongzit

  - software: gaussian
    id: g-l103-internal-coordinate-error
    pattern: FormBX had a problem|Linear angle in (?:Bend|Tors)|Error in internal coordinate system|(?:Bend|Tors)
      failed for (?:angle|dihedral)
    links:
    - l103
    meaning: The redundant internal coordinate system broke down, typically because three or more atoms became (nearly)
      collinear during the optimization. ARC tags every l103 termination as 'InternalCoordinateError' + 'NoSymm'.
    fixes:
    - Optimize in Cartesian coordinates (opt=cartesian); for expensive systems do a few Cartesian steps, then continue
      with the default optimizer from the new structure. Not usable together with opt=modredundant.
    - Simply restarting from the last geometry sometimes works because Gaussian then adds linear-bend coordinates
      itself.
    - (ARC retry 1) opt=(cartesian) and nosymm (plus int=(Acc2E=14)); later retries keep opt=(cartesian) for opt jobs.
    sources:
    - arc:trsh.py:determine_ess_status:122
    - arc:trsh.py:trsh_keyword_cartesian:1888
    - arc:trsh.py:trsh_keyword_nosymm:1959
    - wongzit

  - software: gaussian
    id: g-l103-generic
    pattern: Error termination via Lnk1e in \S*l103\.exe
    links:
    - l103
    priority: 20
    meaning: Any failure inside the Berny optimizer link. ARC does not distinguish sub-causes and applies its internal-coordinate
      fix to all of them; see the specific l103 entries for cause-specific advice.
    fixes:
    - (ARC retry 1) opt=(cartesian) + nosymm (+ int=(Acc2E=14)).
    sources:
    - arc:trsh.py:determine_ess_status:122
    - arc:parser/adapters/gaussian.py:logfile_contains_errors:132

  - software: gaussian
    id: g-l103-error-imposing-constraints
    pattern: (?m)^\s*Error imposing constraints\s*$
    links:
    - l103
    meaning: In constrained optimizations (opt=modredundant with frozen/scanned coordinates, QST2, ...) the optimizer
      cannot find a step that satisfies the constraints from the current structure.
    fixes:
    - For QST2 use opt=QST3 or a Berny TS search instead.
    - For modredundant jobs use a smaller step or adjust the starting geometry.
    - For other constrained optimizations perturb the geometry slightly and resubmit.
    sources:
    - wongzit

  - software: gaussian
    id: g-l103-redstp-max-iterations
    pattern: Maximum of\s*(?:\*+|\d+) iterations exceeded in RedStp
    links:
    - l103
    meaning: Optimizer step solving failed, often after NaN eigenvalues appear (reported in freq/opt freq jobs); seems
      to be a program issue rather than an input error.
    fixes:
    - Take the last optimized geometry and rerun opt freq from it.
    sources:
    - wongzit

  - software: gaussian
    id: g-l103-linear-search-skipped
    pattern: Linear search skipped for unknown reason
    links:
    - l103
    meaning: The RFO step could not converge its Lambda parameter, most likely because the Hessian estimate has become
      unreliable.
    fixes:
    - Restart the optimization with a freshly computed Hessian (opt=calcfc).
    sources:
    - wongzit

  - software: gaussian
    id: g-l103-modmin-inconsistency
    pattern: Inconsistency:\s+ModMin=\s*\d+\s+Eigenvalue=
    links:
    - l103
    meaning: Occurs in QST2/QST3 transition-state searches when the eigenvector to follow becomes inconsistent.
    fixes:
    - Switch to a Berny TS optimization (opt=TS, e.g. opt=(TS,calcfc)).
    sources:
    - wongzit

  - software: gaussian
    id: g-l108-invalid-scan-steps
    pattern: Variable\s+\d+\s+has invalid number of steps|Error termination via Lnk1e in \S*l108\.exe
    links:
    - l108
    priority: 40
    meaning: Rigid PES scan input is malformed; usually there are two blank lines instead of one between the Z-matrix
      and the variables section.
    fixes:
    - Remove the extra blank line between Z-matrix and variables.
    - (ARC) Label 'InputError'/'GL108'; no dedicated fix (generic retry adds int=(Acc2E=14) only).
    sources:
    - arc:trsh.py:determine_ess_status:125
    - wongzit

  - software: gaussian
    id: g-l114-initnf
    pattern: ERROR IN INITNF\. NUMBER OF VARIABLES
    links:
    - l114
    meaning: A numerical-gradient (eigenvector-following) optimization was started with no variables declared, e.g.
      optimizing with a method lacking analytic gradients such as CCSD(T).
    fixes:
    - Use a method with analytic gradients, or declare the optimization variables explicitly.
    sources:
    - wongzit

  - software: gaussian
    id: g-l123-irc-deltax
    pattern: Delta-x Convergence NOT Met\s*\n\s*Maximum number of corrector steps exce+ded
    links:
    - l123
    meaning: The IRC corrector step did not converge within the allowed number of cycles (ARC label 'DeltaX'/'GL123').
      A bare 'Delta-x Convergence NOT Met' line is a non-fatal notice in successful IRCs, so the pattern requires
      the following 'Maximum number of corrector steps exceded' line (Gaussian's own spelling).
    fixes:
    - Equivalent manual advice - raise the IRC maxcycle; if that fails switch to the LQA integrator (IRC=LQA).
    - (ARC retry 1) irc=(maxcycle=200) (+ int=(Acc2E=14)).
    - (ARC retry 2) irc=(LQA) (irc options accumulate, i.e. irc=(maxcycle=200,LQA)).
    sources:
    - arc:trsh.py:determine_ess_status:164
    - arc:trsh.py:trsh_keyword_l123:2054
    - wongzit

  - software: gaussian
    id: g-l123-gs2-failure
    pattern: GS2 Optimization Failure
    links:
    - l123
    meaning: The constrained optimization inside the GS2 IRC integrator did not converge (ARC label 'GS2Opt'/'GL123').
    fixes:
    - Manual advice agrees - IRC=LQA is usually the most robust alternative.
    - (ARC retry 1) irc=(LQA) (+ int=(Acc2E=14)).
    sources:
    - arc:trsh.py:determine_ess_status:174
    - arc:trsh.py:trsh_keyword_l123:2069
    - wongzit

  - software: gaussian
    id: g-l202-point-group-change
    pattern: Change in point group or standard orientation\.\s*\n(?:.*\n){0,5}?\s*Error termination via Lnk1e in \S*l202\.exe
    links:
    - l202
    meaning: The point group or standard orientation changed between optimization steps. The message alone is a routine
      notice in many normally terminating opt/scan jobs; it is fatal only when followed by an l202 termination. ARC
      labels EVERY l202 termination 'OptOrientation'/'GL202' with this meaning, even though l202 has other causes
      (see atom-too-close entries).
    fixes:
    - Check the Z-matrix if symmetry dropped to a subgroup; desymmetrize an over-symmetric start structure; reformulate
      with more symmetry if the new point group is higher.
    - If symmetry is not needed, turn it off (nosymm).
    - (ARC) 'OptOrientation' is not handled by trsh_ess_job; only the generic int=(Acc2E=14) retry happens.
    sources:
    - arc:trsh.py:determine_ess_status:129
    - arc:parser/adapters/gaussian.py:logfile_contains_errors:136
    - wongzit

  - software: gaussian
    id: g-l202-distance-matrix
    pattern: Problem with the distance matrix
    links:
    - l202
    meaning: Two or more atoms are (almost) on top of each other, e.g. from a missing minus sign in a Z-matrix dihedral;
      rarely a NaN distance from a program problem.
    fixes:
    - Check the atoms listed under "Small interatomic distances encountered" and fix the coordinates/Z-matrix.
    sources:
    - wongzit

  - software: gaussian
    id: g-l202-atom-too-close
    pattern: (?m)^\s*Atom too close\.?\s*$
    links:
    - l202
    meaning: Some interatomic distance is non-zero but far shorter than chemically reasonable.
    fixes:
    - Correct the structure.
    - If the short contact is intentional, bypass the check with geom=nocrowd.
    sources:
    - wongzit

  - software: gaussian
    id: g-l202-fopt-nvar-ndof
    pattern: FOPT requested but NVar=\s*\d+ while NDOF=\s*\d+
    links:
    - l202
    meaning: A full optimization (FOpt) found that the number of Z-matrix variables does not equal the degrees of
      freedom allowed by the symmetry.
    fixes:
    - If NDOF < NVar run in higher symmetry; if NVar < NDOF remove excess constraints from the Z-matrix.
    - Using Opt instead of FOpt skips the check (not recommended).
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-generic
    pattern: Error termination via Lnk1e in \S*l301\.exe
    links:
    - l301
    priority: 20
    meaning: Setup failure in l301. ARC inspects the line immediately before the termination line; unless it is a
      checkpoint or "Atomic number out of range" message, ARC labels it 'GL301'+'InputError' (charge, multiplicity,
      basis set, or atomic symbol wrong).
    fixes:
    - Read the line just above the termination and match it to a specific l301 entry.
    - (ARC) No dedicated fix for InputError (generic int=(Acc2E=14) retry only).
    sources:
    - arc:trsh.py:determine_ess_status:133
    - arc:trsh.py:determine_ess_status:180

  - software: gaussian
    id: g-chk-data-missing
    pattern: No data on chk file|Basis set data is not on the checkpoint file|Error in GetGes
    links:
    - l301
    - l401
    priority: 60
    meaning: The job asked to read a guess/geometry/basis from the checkpoint file but the data is absent or incompatible.
      ARC checks this on the line just before an l301 or l401 termination and relabels the job 'CheckFile'.
    fixes:
    - (ARC retry 1) drop the checkpoint file (checkfile=None), i.e. rerun without reading from it (+ int=(Acc2E=14)).
    sources:
    - arc:trsh.py:determine_ess_status:180
    - arc:trsh.py:trsh_keyword_checkfile:1858

  - software: gaussian
    id: g-l301-atomic-number-out-of-range
    pattern: Atomic number out of range for \S+ basis
    links:
    - l301
    meaning: The molecule contains an element that the chosen basis set does not define (e.g. 6-31G only covers H-Kr).
      ARC labels it 'GL301'+'BasisSet'.
    fixes:
    - Choose a basis set (or ECP basis) that covers every element present.
    - (ARC) Declared untroubleshootable - job fails with "Could not recognize basis set".
    sources:
    - arc:trsh.py:determine_ess_status:188
    - arc:trsh.py:trsh_ess_job:939
    - wongzit

  - software: gaussian
    id: g-l301-eof-basis-center
    pattern: End of file reading basis center
    links:
    - l301
    meaning: gen was requested but the general basis set section is missing from the input.
    fixes:
    - Append the basis set section, or replace gen with a built-in basis set.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-eof-ecp-pointer
    pattern: EOF while reading ECP pointer card
    links:
    - l301
    meaning: An ECP was requested (e.g. genecp/pseudo=read) but its definition is missing, often because the blank
      line separating basis and ECP sections is absent.
    fixes:
    - Add the ECP definition and make sure a blank line separates it from the basis set section.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-dispersion-no-q-ghost
    pattern: 'R6DQ: No Q value available for IA='
    links:
    - l301
    meaning: Empirical dispersion (em=..., or functionals with built-in dispersion such as wB97XD/B97D) was used with
      ghost (Bq) atoms, for which no dispersion parameters exist.
    fixes:
    - Do not use em/empiricaldispersion with ghost atoms.
    - If a dispersion-including functional is required, IOp(3/124)=4 disables its dispersion term.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-impossible-multiplicity
    pattern: The combination of multiplicity\s+\d+ and\s+\d+ electrons is impossible
    links:
    - l301
    meaning: The given spin multiplicity is inconsistent with the electron count (odd/even mismatch).
    fixes:
    - Correct charge or multiplicity (multiplicity = N_alpha - N_beta + 1).
    - If they look right, check the geometry section for stray characters (e.g. non-ASCII symbols) that change the
      atom count.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-d3-no-s8
    pattern: 'R6DS8: Unable to choose the S8 parameter'
    links:
    - l301
    meaning: GD3/GD3BJ dispersion was requested for a functional for which Gaussian has no D3 parameters.
    fixes:
    - Use a functional that has D3/D3(BJ) parameters (e.g. Minnesota functionals lack D3BJ), drop the dispersion correction,
      or supply literature parameters manually.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-dispersion-missing-element
    pattern: 'R6DRCv: No RCov radius available for IA=|R6DC6: No C6 coefficient available for IA='
    links:
    - l301
    meaning: The dispersion correction has no parameters for one of the elements present (IA gives the atomic number).
    fixes:
    - Switch to a D3-type correction that covers the element, or turn dispersion off.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-unrecognized-atomic-symbol
    pattern: Unrecognized atomic symbol
    links:
    - l301
    meaning: In a gen basis section an atom label is not a valid element symbol; can also happen in multi-step jobs
      where a Z-matrix variable block is misread as basis input after geom=modify.
    fixes:
    - Correct the element symbol in the basis set section.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-makneb-inconsistency
    pattern: 'Inconsistency #2 in MakNEB'
    links:
    - l301
    meaning: Linked to a point-group change combined with user IOps (2/15, 2/16, 2/17) intended to suppress symmetry
      crashes.
    fixes:
    - Remove or carefully revise the IOp settings.
    sources:
    - wongzit

  - software: gaussian
    id: g-l301-no-element-atoms-found
    pattern: No [A-Z][a-z]? atoms found in this molecule
    links:
    - l301
    meaning: The gen/genecp section defines a basis for an element that does not appear in the geometry.
    fixes:
    - Remove that element from the basis set section.
    sources:
    - wongzit

  - software: gaussian
    id: g-l401-projection-failed
    pattern: Unable to project read-in occupied orbitals
    links:
    - l401
    meaning: Projecting a checkpoint MO guess onto the new basis failed; known with basis sets such as CEP-121G* that
      carry placeholder polarization functions. ARC labels any l401 termination 'GL401'+'BasisSet' (unless the checkpoint-data
      message is present, see g-chk-data-missing).
    fixes:
    - Use CEP-121G instead of CEP-121G* for the affected elements.
    - Do not read the guess from the checkpoint (drop guess=read).
    - (ARC) Not handled specifically; generic int=(Acc2E=14) retry only.
    sources:
    - arc:trsh.py:determine_ess_status:135
    - arc:trsh.py:determine_ess_status:197
    - wongzit

  - software: gaussian
    id: g-l402-mm-microiterations
    pattern: MM microiterations failed
    links:
    - l402
    meaning: In ONIOM/MM runs the microiterations failed, typically from a poor starting geometry with fragments too
      close together.
    fixes:
    - Improve the starting geometry.
    sources:
    - wongzit

  - software: gaussian
    id: g-l502-scf-not-converged
    pattern: Convergence failure\s*--\s*run terminated
    links:
    - l502
    meaning: The SCF did not converge (ARC labels any l502 termination without the CalDSu message as 'SCF'+'GL502'+'NoSymm').
    fixes:
    - wongzit defers to a separate SCF-convergence post (not extracted here).
    - (ARC retry 1) scf=(qc) (rewritten to scf=(xqc) by ARC's Gaussian adapter) + nosymm + int=(Acc2E=14).
    - (ARC retry 2) add NDamp=30 -> scf=(xqc,NDamp=30).
    - (ARC retry 3) add NoDIIS -> scf=(xqc,NDamp=30,NoDIIS).
    - (ARC retry 4) guess=INDO.
    - (ARC retry 5) add Fermi, NoIncFock and NoVarAcc -> scf=(xqc,NDamp=30,NoDIIS,Fermi,Noincfock,NoVarAcc).
    sources:
    - arc:trsh.py:determine_ess_status:137
    - arc:trsh.py:trsh_keyword_scf:1905
    - arc:job/adapters/gaussian.py:273
    - wongzit

  - software: gaussian
    id: g-inaccurate-quadrature-caldsu
    pattern: Inaccurate quadrature in CalDSu
    links:
    - l502
    - l1002
    priority: 60
    meaning: The DFT integration grid is not accurate enough for the density (seen in l502 and l1002), sometimes caused
      by a basis-set mistake or an unreasonable structure. ARC only recognises it when it precedes an l502 termination
      (label 'InaccurateQuadrature').
    fixes:
    - First check the basis set section and the geometry.
    - Manual advice matches - finer grid (int=ultrafine, default in G16, or int=grid=300590), SCF=NoVarAcc, guess=INDO,
      then all three combined.
    - (ARC retry 1) int=grid=300590 (+ int=(Acc2E=14)).
    - (ARC retry 2) scf=(NoVarAcc).
    - (ARC retry 3) guess=INDO.
    - (ARC retry 4) re-add int=grid=300590 + guess=INDO with NoVarAcc all together.
    sources:
    - arc:trsh.py:determine_ess_status:138
    - arc:trsh.py:trsh_keyword_inaccurate_quadrature:2010
    - wongzit

  - software: gaussian
    id: g-l508-qc-scf-failure
    pattern: Error termination via Lnk1e in \S*l508\.exe
    links:
    - l508
    meaning: The quadratically convergent SCF (SCF=QC/XQC/YQC, run in l508) itself failed; output usually ends with
      "Convergence failure." (ARC label 'no_xqc'/'GL508').
    fixes:
    - Remove SCF=QC/XQC/YQC and resubmit with other SCF settings.
    - (ARC retry) removes scf=(qc) from its method list (trsh_keyword_no_qc).
    - '(ARC) Note: the QC removal does not take effect (no_xqc/no_qc mismatch), see docs/arc-upstream-issues.md #5.'
    sources:
    - arc:trsh.py:determine_ess_status:150
    - arc:trsh.py:trsh_keyword_no_qc:2109
    - wongzit

  - software: gaussian
    id: g-l602-getvdw-no-radius
    pattern: GetVDW:\s+no radius for atom
    links:
    - l602
    meaning: An ESP charge fit (e.g. pop=CHELPG/MK) has no built-in van der Waals radius for one of the elements.
    fixes:
    - Add readradii to the pop keyword and supply the element's radius at the end of the input.
    sources:
    - wongzit

  - software: gaussian
    id: g-l716-zmatrix-angle-range
    pattern: Error on Z-matrix card number\s+\d+|angle Alpha is outside the valid range of 0 to 180
    links:
    - l716
    meaning: After large geometry changes a Z-matrix angle left the allowed 0-180 degree range and conversion back
      to Cartesians failed (ARC label 'ZMat'/'GL716').
    fixes:
    - Redefine the Z-matrix or optimize in another coordinate system (e.g. Cartesian/redundant internals).
    - (ARC) 'ZMat' is not handled by trsh_ess_job; generic int=(Acc2E=14) retry only.
    sources:
    - arc:trsh.py:determine_ess_status:153
    - wongzit

  - software: gaussian
    id: g-l801-frozen-core-mixing
    pattern: Excessive mixing of frozen core and valence orbitals
    links:
    - l801
    meaning: The frozen-core approximation (post-HF, double hybrids, TD) is invalid because core and valence orbitals
      mix strongly.
    fixes:
    - Correlate all electrons, e.g. MP2(full), CCSD(T,full).
    - Or suppress the check with IOp(8/11=1) and verify the result afterwards.
    sources:
    - wongzit

  - software: gaussian
    id: g-l801-small-delta-epsilon
    pattern: '\*\*\*\* Fatal Problem: The smallest (?:alpha|beta) delta epsilon is'
    links:
    - l801
    meaning: An orbital-energy gap used as a denominator in the integral transformation is near zero or negative,
      giving numerical instability.
    fixes:
    - IOp(8/11=1) turns the stop into a warning (check results).
    - Try a functional with more HF exchange to widen the gap. The source says these fixes are untested.
    sources:
    - wongzit

  - software: gaussian
    id: g-l801-findco-consistency
    pattern: 'Consistency failure #1 in FindCO'
    links:
    - l801
    meaning: Likely an inconsistent gen/genecp basis specification (e.g. diffuse/polarization functions or an element
      without a basis).
    fixes:
    - Check the basis set section and make sure every element has a basis defined.
    sources:
    - wongzit

  - software: gaussian
    id: g-l906-mp2-getrsb
    pattern: KLT\.ge\.NIJTC in GetRSB|Error termination via Lnk1e in \S*l906\.exe
    links:
    - l906
    priority: 40
    meaning: The MP2 step failed; possibly related to pseudopotential basis sets like CEP-121G* that declare nonexistent
      polarization functions (ARC label 'MP2'/'GL906').
    fixes:
    - Use CEP-121G instead of CEP-121G*.
    - (ARC) 'MP2' is not handled by trsh_ess_job; generic int=(Acc2E=14) retry only.
    sources:
    - arc:trsh.py:determine_ess_status:156
    - wongzit

  - software: gaussian
    id: g-l913-cc-max-cycles
    pattern: \*MAX\. CYCLES\*
    links:
    - l913
    meaning: The iterative CCSD/CCSD(T)/CISD amplitude equations did not converge in the allowed cycles (default 50).
      NOT a geometry-optimization problem, although ARC labels it 'MaxOptCycles'/'GL913'.
    fixes:
    - Inspect DE(Corr) and Delta across iterations; if converging slowly, raise the limit, e.g. CCSD(T,MaxCyc=100).
    - If oscillating, check the geometry and reference state, then try small structural changes or another basis set.
    - (ARC) Applies its geometry fixes (opt=(maxcycle=200), then opt=(RFO), opt=(GDIIS), opt=(GEDIIS)), which do not
      address CC non-convergence.
    - '(ARC) See docs/arc-upstream-issues.md #4.'
    sources:
    - arc:trsh.py:determine_ess_status:161
    - arc:trsh.py:trsh_keyword_opt_maxcycles:1974
    - wongzit

  - software: gaussian
    id: g-l914-cisax-memory
    pattern: CISAX needs\s+\d+ more words of memory
    links:
    - l914
    meaning: Not enough memory for the CIS/TD step.
    fixes:
    - Increase %mem or reduce %nprocshared.
    sources:
    - wongzit

  - software: gaussian
    id: g-l1002-no-3rd-derivs
    pattern: No func 3rd derivs with
    links:
    - l1002
    meaning: A polar job needs analytic third derivatives (hyperpolarizability) that the chosen functional (e.g. LC-wPBE/HSE)
      does not provide.
    fixes:
    - Use a method with analytic 3rd derivatives, or polar=Numerical.
    - The polarizability printed before the error is still usable if only alpha is needed.
    sources:
    - wongzit

  - software: gaussian
    id: g-l1002-nij-max2-mmcore
    pattern: NIJ > Max2 in MMCore
    links:
    - l1002
    meaning: Known Gaussian 09 bug fixed in G09 revision C.01.
    fixes:
    - Use Gaussian 09 C.01 or later.
    sources:
    - wongzit

  - software: gaussian
    id: g-l1002-alaxao-memory
    pattern: \d+ words are not enough for AlAXAO
    links:
    - l1002
    meaning: Not enough memory for the CPHF/XC quadrature step.
    fixes:
    - Increase %mem or reduce %nprocshared.
    sources:
    - wongzit

  - software: gaussian
    id: g-l1002-cphf-not-converged
    pattern: CPHF failed to converge in LinEq2
    links:
    - l1002
    meaning: The coupled-perturbed HF/KS equations did not converge, typically in frequency calculations.
    fixes:
    - Use a finer CPHF grid, cphf=grid=fine.
    sources:
    - wongzit

  - software: gaussian
    id: g-l9999-max-opt-steps
    pattern: -- Number of steps exceeded,\s+NStep=\s*\d+
    links:
    - l9999
    priority: 60
    meaning: The geometry optimization used up its maximum number of steps without converging (ARC label 'MaxOptCycles'/'GL9999').
      In relaxed scans it can appear for an individual scan point in a job that still terminates normally.
    fixes:
    - Manual advice - if the energy is not oscillating, restart from the last geometry with opt=(maxcycles=N) at 2-3x
      the previous count; if oscillating try opt=RFO/GDIIS/GEDIIS, opt=cartesian, changed symmetry, or another functional/basis.
    - (ARC retry 1) opt=(maxcycle=200) (+ int=(Acc2E=14)).
    - (ARC retry 2) opt=(RFO) (merged, e.g. opt=(maxcycle=200,RFO)).
    - (ARC retry 3) opt=(GDIIS) (replaces RFO in the merged opt keyword).
    - (ARC retry 4) opt=(GEDIIS) (replaces GDIIS).
    sources:
    - arc:trsh.py:determine_ess_status:103
    - arc:trsh.py:trsh_keyword_opt_maxcycles:1974
    - wongzit

  - software: gaussian
    id: g-l9999-wrong-neg-eigenvalues
    pattern: '-- Wrong number of Negative eigenvalues: Desired=\s*\d+\s+Actual=\s*\d+'
    links:
    - l9999
    priority: 60
    meaning: At the end of a TS optimization Gaussian found a Hessian with a different number of negative eigenvalues
      than requested and stopped (ARC label 'NegEigenvalues'/'GL9999').
    fixes:
    - (ARC retry 1) opt=(noeigen) (+ int=(Acc2E=14)); manual advice gives the same keyword (opt=noeigentest).
    sources:
    - arc:trsh.py:determine_ess_status:109
    - arc:trsh.py:trsh_keyword_neg_eigen:2081
    - wongzit

  - software: gaussian
    id: g-l9999-unconverged-generic
    pattern: Error termination request processed by link 9999|Error termination via Lnk1e in \S*l9999\.exe
    links:
    - l9999
    priority: 20
    meaning: l9999 termination without the step-count or eigenvalue messages; ARC treats it as a generic unconverged
      optimization ('Unconverged'/'GL9999').
    fixes:
    - (ARC retry 1) switch on ARC's "fine" mode - integral=(grid=ultrafine, Acc2E=12 or 14), scf=(tight,direct), and
      opt=(...,tight,maxstep=5,maxcycle=N) for opt jobs (DFT/composite methods).
    sources:
    - arc:trsh.py:determine_ess_status:115
    - arc:trsh.py:trsh_keyword_unconverged:1946
    - arc:job/adapters/gaussian.py:296

  - software: gaussian
    id: g-l9999-dummy-atom-zmatrix
    pattern: Determination of dummy atom variables in z-matrix conversion failed
    links:
    - l9999
    meaning: The optimization converged but the final structure could not be converted back to the input Z-matrix
      because of dummy atoms.
    fixes:
    - Use the Cartesian coordinates of the converged structure.
    sources:
    - wongzit

  - software: gaussian
    id: g-disk-full-erroneous-write
    pattern: 'Erroneous write(?: during file extend)?\. write -?\d+ instead of \d+|Write error in NtrExt1'
    priority: 60
    meaning: Writing a scratch/checkpoint file failed, almost always because disk space or quota ran out (occasionally
      an unreachable network filesystem). ARC label 'DiskSpace'.
    fixes:
    - Free disk space / check quota and the scratch filesystem.
    - Reduce job size (e.g. smaller basis) if it simply does not fit.
    - (ARC) Declared untroubleshootable ("ran out of disc space"); no retry.
    sources:
    - arc:trsh.py:determine_ess_status:200
    - arc:trsh.py:trsh_ess_job:934
    - wongzit

  - software: gaussian
    id: g-ntrerr-fileio-checkpoint
    pattern: NtrErr Called from FileIO|Operation on file out of range
    meaning: Data requested from the checkpoint file (opt=readfc, guess=read, geom=allcheck/modify) is missing, e.g.
      never computed or the earlier job died before writing it. ARC label 'CheckFile'.
    fixes:
    - Recompute the missing data or provide it in the input.
    - (ARC retry 1) run without the checkpoint file (checkfile=None) (+ int=(Acc2E=14)).
    sources:
    - arc:trsh.py:determine_ess_status:204
    - arc:trsh.py:trsh_keyword_checkfile:1858
    - wongzit

  - software: gaussian
    id: g-memory-allocation-failed
    pattern: malloc failed|galloc:\s+could not allocate memory
    priority: 60
    meaning: Gaussian could not obtain the memory it asked for; Gaussian needs noticeably more than %mem (roughly
      1 GB extra), so %mem close to the scheduler limit fails. ARC label 'GaussianMemoryAllocation'.
    fixes:
    - Manual advice - lower %mem, or raise the scheduler request (e.g. --mem), leaving at least ~1 GB gap.
    - (ARC) keep the queue memory request fixed and lower the %mem fraction of it one step per retry along gaussian_memory_headroom_fractions
      = [0.90, 0.75, 0.60]; after 0.60 give up.
    sources:
    - arc:trsh.py:determine_ess_status:208
    - arc:trsh.py:trsh_ess_job:1023
    - wongzit

  - software: gaussian
    id: g-scratch-dir-missing
    pattern: 'PGFIO/stdio: No such file or directory'
    meaning: A scratch/input file could not be opened, typically because GAUSS_SCRDIR points to a nonexistent directory.
      ARC label 'Scratch'.
    fixes:
    - Create the directory (mkdir -p $GAUSS_SCRDIR in the submit script) or point GAUSS_SCRDIR to an existing one.
    - (ARC) 'Scratch' is not handled by trsh_ess_job; generic int=(Acc2E=14) retry only.
    sources:
    - arc:trsh.py:determine_ess_status:212
    - wongzit

  - software: gaussian
    id: g-install-world-accessible
    pattern: Files in the Gaussian directory are world accessible
    meaning: Gaussian refuses to run because its installation directory permissions are too open.
    fixes:
    - Restrict permissions, e.g. chmod -R 750 on the Gaussian directory.
    sources:
    - wongzit

  - software: gaussian
    id: g-failed-open-execfile
    pattern: failed to open execfile
    meaning: System-level failure launching Gaussian; one known cause is requesting Linda parallelism (%nprocl) on
      a build without Linda.
    fixes:
    - Replace %nprocl with %nprocshared (nproc).
    sources:
    - wongzit


  # ====================================================================================================
  # ORCA
  # ====================================================================================================
  - software: orca
    id: o-maxcore-insufficient
    pattern: Please increase MaxCore
    priority: 60
    meaning: 'ORCA ran out of per-core memory (%maxcore) in SCF or MDCI; newer versions print the needed amount, e.g.
      "to more than: 289 MB" or "by at least ( 6735.6 MB)". ARC labels ''SCF''+''Memory'' or ''MDCI''+''Memory''.'
    fixes:
    - Newer ORCA prints 'Please increase MaxCore - by at least ( X MB)'; the wording reads as an increment over the
      current %maxcore, so set %maxcore to at least current + X (ARC uses X as the new total, see docs/arc-upstream-issues.md).
    - '%maxcore is per process: total memory = %maxcore x nprocs (+ headroom), so fewer processes with a larger %maxcore
      is the other lever.'
    - (ARC) set per-core memory to the reported value + 500 MB (MDCI - the largest value reported by any process),
      rounded up to the next 100 MB; total job memory = ceil(per_core x cores / 1024 + 5) GB.
    - (ARC) if no number is printed, estimate from the number of heavy atoms (estimate_orca_mem_cpu_requirement).
    sources:
    - arc:trsh.py:determine_ess_status:301
    - arc:trsh.py:determine_ess_status:320
    - arc:trsh.py:trsh_ess_job:1105

  - software: orca
    id: o-scf-error-termination
    pattern: ORCA finished by error termination in SCF
    priority: 30
    meaning: The SCF module aborted; without a MaxCore message ARC labels it 'SCF' only (often SCF non-convergence).
    fixes:
    - Check charge/multiplicity and geometry first; then see the ORCA manual's SCF convergence section (more iterations
      via %scf MaxIter, SlowConv/VerySlowConv, a better guess read from a converged .gbw).
    - (ARC) none - trsh_ess_job has no ORCA SCF branch, so the job is marked untroubleshootable unless the memory
      message is present.
    sources:
    - arc:trsh.py:determine_ess_status:301
    - arc:parser/adapters/orca.py:logfile_contains_errors:77

  - software: orca
    id: o-mdci-error-termination
    pattern: ORCA finished by error termination in MDCI
    priority: 30
    meaning: The coupled-cluster (MDCI) module aborted; without a more specific message ARC assumes a memory problem
      ('MDCI'+'Memory').
    fixes:
    - (ARC) same memory increase as o-maxcore-insufficient, using the heavy-atom estimate.
    sources:
    - arc:trsh.py:determine_ess_status:320
    - arc:trsh.py:determine_ess_status:361

  - software: orca
    id: o-mdci-too-many-processes
    pattern: 'Number of processes(?: \(\d+\))? in parallel calculation exceeds number of pairs'
    priority: 60
    meaning: More MPI processes than electron pairs were requested for the MDCI step. ARC labels 'MDCI'+'cpu'.
    fixes:
    - (ARC) set the core count to the pair count printed as "(N)" (ORCA 4.2+); for older versions without numbers
      estimate cores from the number of heavy atoms.
    sources:
    - arc:trsh.py:determine_ess_status:345
    - arc:trsh.py:trsh_ess_job:1144

  - software: orca
    id: o-gtoint-error
    pattern: ORCA finished by error termination in GTOInt
    priority: 30
    meaning: The integral module aborted; ARC assumes a memory allocation error ('GTOInt'+'Memory').
    fixes:
    - (ARC) memory increase using the heavy-atom estimate (as in o-maxcore-insufficient).
    sources:
    - arc:trsh.py:determine_ess_status:391
    - arc:trsh.py:trsh_ess_job:1105

  - software: orca
    id: o-multiplicity-impossible
    pattern: 'Error : multiplicity \(\d+\) is (?:even|odd) and number of electrons \(\d+\) is (?:even|odd)'
    meaning: Charge and multiplicity are inconsistent with the electron count. ARC label 'Input'.
    fixes:
    - Correct charge/multiplicity. (ARC) no automatic fix.
    sources:
    - arc:trsh.py:determine_ess_status:365
    - arc:parser/adapters/orca.py:logfile_contains_errors:81

  - software: orca
    id: o-unrecognized-keyword
    pattern: UNRECOGNIZED OR DUPLICATED KEYWORD\(S\) IN SIMPLE INPUT LINE
    meaning: A "!" simple-input keyword is unknown or duplicated; the offending keyword is printed on the following
      line. ARC label 'Syntax'.
    fixes:
    - Fix or remove the keyword printed under the message.
    - '(ARC) The ''Syntax'' label makes the job adapter raise JobError (arc/job/adapter.py:1062): no retry.'
    sources:
    - arc:trsh.py:determine_ess_status:369
    - arc:job/adapter.py:1062

  - software: orca
    id: o-no-cabs-basis
    pattern: There are no CABS\s+basis functions on atom number\s+\d+
    meaning: The F12 complementary auxiliary (CABS) basis does not cover an element present (element shown in parentheses).
      ARC label 'Basis'.
    fixes:
    - Pick a CABS/F12 basis that supports that element. (ARC) no automatic fix.
    sources:
    - arc:trsh.py:determine_ess_status:379

  - software: orca
    id: o-wavefunction-not-converged
    pattern: This wavefunction IS NOT FULLY CONVERGED!
    meaning: The SCF did not converge and ORCA refuses to continue to properties or correlation. ARC label 'Convergence'.
    fixes:
    - Restart with a larger SCF MaxIter or different convergence settings (ORCA's own advice). (ARC) no automatic
      fix.
    - Check charge/multiplicity and geometry first; then see the ORCA manual's SCF convergence section (more iterations
      via %scf MaxIter, SlowConv/VerySlowConv, a better guess read from a converged .gbw).
    sources:
    - arc:trsh.py:determine_ess_status:386

  - software: orca
    id: o-terminated-abnormally
    pattern: ORCA TERMINATED ABNORMALLY
    priority: 20
    meaning: Generic abnormal ORCA termination (used by ARC's parser only, not by trsh).
    fixes:
    - Read the excerpt around the matched line; the lines just above it name the cause.
    sources:
    - arc:parser/adapters/orca.py:logfile_contains_errors:83

  - software: orca
    id: o-error-termination-other-module
    pattern: ORCA finished by error termination in \w+
    priority: 10
    meaning: 'Generic: an ORCA module aborted (the module name follows ''in'', e.g. LEANSCF, SCF, MDCI, GTOInt, CASSCF).
      Used when no more specific entry matched; the lines above it (often an MPI or ''FATAL ERROR ENCOUNTERED'' block)
      name the cause.'
    fixes:
    - Read the lines above the termination message; with MPI runs the first failing process usually printed the real
      error.
    - If the module is memory-hungry (MDCI, integral modules), check %maxcore x nprocs against the job's memory request.
    sources:
    - arc:trsh.py:determine_ess_status:301
    - arc:testing/stability/orca_rhf_uhf_instability_no_restart_crash.out


  # ====================================================================================================
  # QCHEM
  # ====================================================================================================
  - software: qchem
    id: q-max-opt-cycles
    pattern: MAXIMUM OPTIMIZATION CYCLES REACHED
    severity: fatal
    meaning: Geometry optimization hit its cycle limit (Q-Chem default 50). ARC label 'MaxOptCycles' (checked only
      for opt/conf_opt/ts jobs). Q-Chem still prints its normal closing banner after this (ARC's own comment in trsh.py
      l.236-237), so this entry overrides the success marker.
    fixes:
    - (ARC retry 1) add GEOM_OPT_MAX_CYCLES 250 to $rem.
    - (ARC later retries) SCF_ALGORITHM DIIS_GDM, MAX_SCF_CYCLES 250, SYM_IGNORE True (replaces, not adds to, the
      previous $rem additions).
    - '(ARC) Note: for opt jobs ARC''s status check returns ''done'' when the closing banner is present, so this retry
      may never run; see docs/arc-upstream-issues.md #10.'
    sources:
    - arc:trsh.py:determine_ess_status:255
    - arc:trsh.py:trsh_ess_job:1082
    - arc:trsh.py:determine_ess_status:236

  - software: qchem
    id: q-scf-failed
    pattern: SCF failed
    meaning: The SCF did not converge. ARC label 'SCF'.
    fixes:
    - (ARC retry 1) SCF_ALGORITHM DIIS_GDM, MAX_SCF_CYCLES 1000.
    - (ARC retry 2) SCF_ALGORITHM DIIS_GDM, MAX_SCF_CYCLES 250, SYM_IGNORE True.
    sources:
    - arc:trsh.py:determine_ess_status:240
    - arc:trsh.py:trsh_ess_job:1087

  - software: qchem
    id: q-generic-error-line
    pattern: (?m)^(?!.*(?:DIIS|gprntSymmMtrx|Relative error|zonesort)).*error
    priority: 0
    meaning: 'LAST-RESORT FALLBACK, mirroring ARC: a line containing lower-case ''error'' (lines with DIIS, gprntSymmMtrx,
      ''Relative error'' or zonesort are ignored, as in ARC''s Q-Chem parser). Only reported when nothing else matched
      and the job did not terminate normally; ARC treats it as an SCF failure (''SCF''+''DIIS''), which is often wrong
      - read the excerpt.'
    fixes:
    - (ARC) same chain as q-scf-failed.
    sources:
    - arc:trsh.py:determine_ess_status:244
    - arc:parser/adapters/qchem.py:logfile_contains_errors:47

  - software: qchem
    id: q-invalid-charge-multiplicity
    pattern: Invalid charge/multiplicity combination
    meaning: Charge and multiplicity are inconsistent with the electron count.
    fixes:
    - Correct charge/multiplicity. (ARC raises SpeciesError; no retry.)
    sources:
    - arc:trsh.py:determine_ess_status:251


  # ====================================================================================================
  # MOLPRO
  # ====================================================================================================
  - software: molpro
    id: m-no-convergence
    pattern: (?m)^(?!.*\?No convergence in rhfpr).*No convergence
    priority: 40
    meaning: A Molpro iterative procedure (HF/MCSCF etc.) did not converge; the benign "?No convergence in rhfpr"
      message is excluded. ARC label 'Unconverged'.
    fixes:
    - (ARC retry 1) level shift in the HF block - shift,-1.0,-0.5;
    - (ARC retry 2) degrade basis to cc-pVDZ ('vdz').
    - (ARC retry 3) cc-pVDZ + shift,-1.0,-0.5;
    - (ARC retry 4) memory = the whole node's memory (servers[server]['memory']) + shift,-1.0,-0.5;
    - '(ARC) Note: the shift and cc-pVDZ retries never reach the Molpro input, only the memory change of retry 4 does;
      see docs/arc-upstream-issues.md #14.'
    sources:
    - arc:trsh.py:determine_ess_status:407
    - arc:trsh.py:trsh_ess_job:1176

  - software: molpro
    id: m-orbital-ignore-error
    pattern: error exit can be avoided using the IGNORE_ERROR option on the ORBITAL directive
    meaning: Orbitals read from a previous step failed Molpro's check (e.g. not converged); Molpro suggests ORBITAL,IGNORE_ERROR.
      ARC label 'IGNORE_ERROR in the ORBITAL directive'.
    fixes:
    - Add ORBITAL,IGNORE_ERROR; (ARC's Molpro adapter can insert this, but trsh_ess_job does not forward the label,
      so in practice ARC applies the m-no-convergence chain).
    sources:
    - arc:trsh.py:determine_ess_status:411
    - arc:job/adapters/molpro.py:262

  - software: molpro
    id: m-triples-memory
    pattern: A further\s+[\d.]+\s+Mwords of memory are needed for the triples to run\.\s+Increase memory to\s+[\d.]+\s+Mwords
    priority: 60
    meaning: The (T) triples step needs more memory than allocated. ARC label 'Memory'; it prefers the amount from
      the "For full I/O caching in triples, increase memory by X Mwords" line.
    fixes:
    - Set memory to at least the 'Increase memory to ... Mwords' value Molpro prints (the 'full I/O caching' value,
      if affordable, avoids triples I/O). Raise Molpro's memory card `memory,N,m` (mega-words = 8 MB, PER MPI PROCESS;
      see knowledge/ess/molpro/molpro-essentials.md) and keep N x processes x 8 MB within the job's memory request.
    - (ARC) new memory = old GB + ceil(X/100)*100 MW / 128 + 5 GB, where X is the full-I/O increment; if that line
      is absent, ARC effectively triples the memory.
    - '(ARC) Note: see docs/arc-upstream-issues.md #7 for why the amount is often lost.'
    sources:
    - arc:trsh.py:determine_ess_status:415
    - arc:trsh.py:trsh_ess_job:1160

  - software: molpro
    id: m-insufficient-memory-require
    pattern: insufficient memory available - require\s+\d+\s+have
    priority: 60
    meaning: Not enough memory for an allocation; the required number of words follows "require". ARC label 'Memory'.
    fixes:
    - Raise Molpro's memory card `memory,N,m` (mega-words = 8 MB, PER MPI PROCESS; see knowledge/ess/molpro/molpro-essentials.md)
      and keep N x processes x 8 MB within the job's memory request.
    - (ARC) add (required words / 1e6) MW, rounded up to 100 MW, converted by /128 to GB, plus 5 GB.
    sources:
    - arc:trsh.py:determine_ess_status:426
    - arc:trsh.py:trsh_ess_job:1160

  - software: molpro
    id: m-insufficient-memory-allocate
    pattern: Insufficient memory to allocate a new array of length\s+\d+|The problem occurs in memory
    priority: 55
    meaning: An array allocation failed for lack of memory. ARC label 'Memory'.
    fixes:
    - Raise Molpro's memory card `memory,N,m` (mega-words = 8 MB, PER MPI PROCESS; see knowledge/ess/molpro/molpro-essentials.md)
      and keep N x processes x 8 MB within the job's memory request.
    - (ARC) memory x 3 (no amount is parsed).
    sources:
    - arc:trsh.py:determine_ess_status:433
    - arc:trsh.py:trsh_ess_job:1171

  - software: molpro
    id: m-basis-library-exhausted
    pattern: Basis library exhausted
    priority: 60
    meaning: The requested basis set is not in Molpro's library for some element (basis name on the preceding "SETTING
      BASIS" line). ARC label 'BasisSet'.
    fixes:
    - Choose a basis available in Molpro for all elements. (ARC) untroubleshootable ("Could not recognize basis set").
    sources:
    - arc:trsh.py:determine_ess_status:439
    - arc:trsh.py:trsh_ess_job:939

  - software: molpro
    id: m-problem-occurs-generic
    pattern: \? The problem occurs in
    priority: 20
    meaning: 'Generic Molpro error trailer. ARC tests the lower-case string "the problem occurs", so it does not match
      Molpro''s capitalized "? The problem occurs in ..." lines (see docs/arc-upstream-issues.md #8); intended label
      ''Unknown''.'
    fixes:
    - (ARC, for 'Unknown') resubmit on another node (change_node), then the m-no-convergence chain.
    sources:
    - arc:trsh.py:determine_ess_status:459


  # ====================================================================================================
  # PSI4
  # ====================================================================================================
  - software: psi4
    id: p-psio-error
    pattern: PSIO Error
    meaning: Psi4 scratch/file I/O error (e.g. disk full or scratch not writable).
    fixes:
    - Point PSI_SCRATCH at an existing, writable, local (not network) directory with enough free space (Psi4 manual,
      'Scratch files' / external.rst).
    sources:
    - arc:parser/adapters/psi_4.py:logfile_contains_errors:43

  - software: psi4
    id: p-fatal-error
    pattern: Fatal Error
    priority: 20
    meaning: Psi4 aborted with a fatal error; the lines around it give the cause.
    fixes:
    - Read the excerpt around the matched line; the lines just above it name the cause.
    sources:
    - arc:parser/adapters/psi_4.py:logfile_contains_errors:45

  - software: psi4
    id: p-runtime-error
    pattern: RuntimeError
    priority: 20
    meaning: A Python/C++ runtime exception (Psi4 raises many failures, including convergence failures, this way).
    fixes:
    - Read the excerpt around the matched line; the lines just above it name the cause.
    sources:
    - arc:parser/adapters/psi_4.py:logfile_contains_errors:47

  - software: psi4
    id: p-scf-not-converged
    pattern: Could not converge SCF iterations in \d+ iterations
    priority: 70
    meaning: The SCF hit its iteration limit (SCFConvergenceError).
    fixes:
    - Raise the limit (set scf maxiter), then try damping (damping_percentage), level shifting (level_shift) or second-order
      convergence (soscf true); check charge/multiplicity and the geometry first (Psi4 manual, SCF chapter).
    sources:
    - psi4:psi4/driver/procrouting/scf_proc/scf_iterator.py (raise SCFConvergenceError)
    - psi4:psi4/driver/p4util/exceptions.py:ConvergenceError
    - psi4:doc/sphinxman/source/scf.rst

  - software: psi4
    id: p-opt-not-converged
    pattern: Could not converge geometry optimization in \d+ iterations
    priority: 70
    meaning: optking reached geom_maxiter without converging (OptimizationConvergenceError).
    fixes:
    - Restart from the last geometry with a larger geom_maxiter; for difficult cases compute the Hessian (full_hess_every)
      (Psi4 manual, optking chapter).
    sources:
    - psi4:psi4/driver/driver.py (raise OptimizationConvergenceError)
    - psi4:doc/sphinxman/source/optking.rst

  - software: psi4
    id: p-encountered-error
    pattern: \*\*\* Psi4 encountered an error
    priority: 10
    meaning: Psi4's exit banner for any uncaught exception. The boxed message and the Python exception line just above
      it give the real cause.
    fixes:
    - Read the '!---!' message box and the '...Error:' line above the banner.
    sources:
    - psi4:psi4/extras.py:exit_printing
    - psi4:psi4/run_psi4.py


  # ====================================================================================================
  # SCHEDULER
  # ====================================================================================================
  - software: scheduler
    id: s-memory-exceeded
    pattern: (?i)\bmemory exceeded\b
    severity: fatal
    meaning: Scheduler message (seen in HTCondor job logs, 'Job was held. MEMORY EXCEEDED') - the job was stopped
      for using more memory than requested. ARC label 'Memory'.
    fixes:
    - Request more memory from the scheduler, or lower the program's own memory setting and core count.
    - (ARC) doubles the job memory, capped at node memory x job_max_server_node_memory_allocation (default 0.95).
    sources:
    - arc:trsh.py:determine_job_log_memory_issues:552
    - arc:trsh.py:trsh_ess_job:1047
    - arc:testing/job_log/memory_exceeded.log

  - software: scheduler
    id: s-htcondor-wasting-memory
    pattern: Job Is Wasting Memory using less than \d+ percent of requested Memory
    severity: fatal
    meaning: HTCondor held the job because it used only a small fraction of the memory it requested (a site policy).
      The calculation itself may have been fine up to that point.
    fixes:
    - Resubmit with a smaller memory request (keep the program's own memory setting below it).
    - (ARC) labels this 'Memory' with a 'too high' message; Gaussian skips the memory increase but ORCA and Molpro
      jobs get MORE memory (see docs/arc-upstream-issues.md).
    sources:
    - arc:trsh.py:determine_job_log_memory_issues:556
    - arc:testing/job_log/using_to_few.log

  - software: scheduler
    id: s-slurm-time-limit
    pattern: CANCELLED AT \S+ DUE TO TIME LIMIT
    severity: fatal
    meaning: Slurm killed the job at its walltime limit. The program output simply stops.
    fixes:
    - Restart from the last geometry/checkpoint with a longer --time, or split the job.
    - Confirm with `sacct -j <jobid> --format=JobID,State,Elapsed,Timelimit,MaxRSS`.
    sources:
    - slurm:src/slurmd/slurmstepd/req.c ('*** %s ON %s CANCELLED AT %s DUE TO TIME LIMIT ***')
    - arc:job/adapter.py:926

  - software: scheduler
    id: s-slurm-oom-kill
    pattern: Detected \d+ oom[-_]kill event
    severity: fatal
    meaning: Slurm's cgroup memory limit killed at least one process (out of memory).
    fixes:
    - Raise --mem / --mem-per-cpu, or lower the program's memory setting (%mem, %maxcore, memory,...) so program +
      overhead fits the request.
    - Confirm with `sacct -j <jobid> --format=JobID,State,MaxRSS,ReqMem`.
    sources:
    - slurm:src/plugins/task/cgroup/task_cgroup_memory.c (task_cgroup_memory_check_oom)

  - software: scheduler
    id: s-pbs-walltime
    pattern: 'PBS: job killed: walltime \d+ exceeded limit \d+'
    severity: fatal
    meaning: PBS/Torque killed the job at its walltime limit.
    fixes:
    - Restart from the last geometry/checkpoint with a longer walltime (-l walltime=...).
    sources:
    - arc:job/adapter.py:938

