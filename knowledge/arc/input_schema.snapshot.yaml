  level:
    class: Level
    params:
      repr:
        type: str | dict | Level | None
        doc_type: str, dict, Level optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: 'A dictionary or a simple string representation of the level of theory, e.g. "wb97xd/def2-tzvp",
          or {''method'': ''b3lyp'', ''basis'': ''6-31g''}. Not in ``LevelOfTheory``.'
      method:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Quantum chemistry method.
      basis:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Basis set.
      auxiliary_basis:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Auxiliary basis set for correlated methods.
      dispersion:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The DFT dispersion info (if not already included in method).
      cabs:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Complementary auxiliary basis set for F12 calculations.
      method_type:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The level of theory method type (DFT, wavefunction, force field, semi-empirical, or composite).
          Not in ``LevelOfTheory``.
      software:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Quantum chemistry software.
      software_version:
        type: int | float | str | None
        doc_type: int | float | str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Quantum chemistry software version.
      compatible_ess:
        type: list[str] | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Entries are names of compatible ESS. Not in ``LevelOfTheory``.
      solvation_method:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Solvation method.
      solvent:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The solvent. Values are strings of "known" solvents, see https://gaussian.com/scrf/.
      solvation_scheme_level:
        type: Level | None
        doc_type: Level, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A Level class representing the level of theory to calculate a solvation energy correction at.
          Not in ``LevelOfTheory``.
      args:
        type: dict[str, str] | Iterable | str | None
        doc_type: dict[dict[str, str]], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Additional arguments provided to the software. Different than the ``args`` in ``LevelOfTheory``.
      year:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Optional 4-digit year suffix for differentiating methods such as b97d3/b97d32023.
    dict_keys:
    - method
    - basis
    - auxiliary_basis
    - dispersion
    - cabs
    - method_type
    - software
    - software_version
    - compatible_ess
    - solvation_method
    - solvent
    - solvation_scheme_level
    - args
    - year
