        default_repr: None
        description: 'The Arkane level of theory to use for AEC and BAC. Note: This argument is a ``Level`` type,
          not a ``LevelOfTheory`` type. This argument will only affect AEC/BAC, not the frequency scaling factor.'
      bac_type:
        type: str | None
        doc_type: str, optional
        has_default: true
