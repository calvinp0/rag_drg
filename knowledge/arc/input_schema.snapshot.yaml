          [1, 5], ''levels'': {''opt freq'': ''wb97xd/6-311+g(2d,2p)'', ''sp'': ''ccsd(t)-f12/aug-cc-pvtz-f12''}},
          {''atom_range'': [6, 15], ''levels'': {''opt freq'': ''b3lyp/cbsb7'', ''sp'': ''dlpno-ccsd(t)/def2-tzvp''}},
          {''atom_range'': [16, ''inf''], ''levels'': {''opt freq'': ''b3lyp/6-31g(d,p)'', ''sp'': ''wb97xd/6-311+g(2d,2p)''}}]'
