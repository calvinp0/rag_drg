  reaction:
    class: ARCReaction
    params:
      label:
        type: str
        doc_type: str, optional
        has_default: true
        default: ''
        default_is_literal: true
        default_repr: ''''''
        description: The reaction's label in the format `r1 + r2 <=> p1 + p2` (or unimolecular on either side, as
          appropriate).
      reactants:
        type: list[str] | None
        doc_type: list[str], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of reactant *labels* corresponding to an :ref:`ARCSpecies <species>`.
      products:
        type: list[str] | None
        doc_type: list[str], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of product *labels* corresponding to an :ref:`ARCSpecies <species>`.
      r_species:
        type: list[ARCSpecies] | None
        doc_type: list[ARCSpecies], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of reactants :ref:`ARCSpecies <species>` objects.
      p_species:
        type: list[ARCSpecies] | None
        doc_type: list[ARCSpecies], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of products :ref:`ARCSpecies <species>` objects.
      ts_label:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The :ref:`ARCSpecies <species>` label of the respective TS.
      ts_xyz_guess:
        type: list | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of TS XYZ user guesses, each in a string format.
      family:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The reaction family, if applicable.
      xyz:
        type: list | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Identical to `ts_xyz_guess`, used as a shortcut.
      multiplicity:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The reaction surface multiplicity. A trivial guess will be made unless provided.
      charge:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The reaction surface charge.
      reaction_dict:
        type: dict | None
        doc_type: dict, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A dictionary to create this object from (used when restarting ARC).
      species_list:
        type: list[ARCSpecies] | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A list of ARCSpecies entries for matching reactants and products to existing species.
      preserve_param_in_scan:
        type: list | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Entries are length two iterables of atom indices (1-indexed) between which distances and dihedrals
          of these pivots must be preserved. Used for identification of rotors which break a TS.
      kinetics:
        type: dict[str, float | tuple[float, str]]
        doc_type: dict[str, float | tuple[float, str]], optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The high pressure limit rate coefficient calculated by ARC. Keys are 'A' (value, unit), n (value),
          and Ea (value, unit).
    dict_keys_read:
    - atom_map
    - charge
    - done_opt_r_n_p
    - family
    - family_own_reverse
    - index
    - label
    - long_kinetic_description
    - multiplicity
    - p_species
    - preserve_param_in_scan
    - products
    - r_species
    - reactants
    - ts_label
    - ts_species
    - ts_xyz_guess
    - xyz
