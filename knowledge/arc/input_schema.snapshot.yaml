  species:
    class: ARCSpecies
    params:
      active:
        type: dict | None
        doc_type: dict, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: 'The active orbitals. Possible keys are: ''occ'' (list[int]): The occupied orbitals. ''closed''
          (list[int]): The closed-shell orbitals. ''frozen'' (list[int]): The frozen orbitals. ''core'' (list[int]):
          The core orbitals. ''e_o'' (tuple[int, int]): The number of active electrons, determined by the total
          number of electrons minus the core electrons (2 e''s per heavy atom), and the number of active orbitals,
          determined by the number of closed-shell orbitals and active orbitals (w/o core orbitals).'
      adjlist:
        type: str
        doc_type: str, optional
        has_default: true
        default: ''
        default_is_literal: true
        default_repr: ''''''
        description: An `RMG adjacency list <https://reactionmechanismgenerator.github.io/RMG-Py/reference/molecule/adjlist.html>`_
          representation for the species 2D graph.
      bdes:
        type: list | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Specifying for which bonds should bond dissociation energies be calculated. Entries are bonded
          atom indices tuples (1-indexed). An 'all_h' string entry is also allowed, triggering BDE calculations
          for all hydrogen atoms in the molecule.
      bond_corrections:
        type: dict | None
        doc_type: dict, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The bond additivity corrections (BAC) to be used. Determined from the structure if not directly
          given.
      charge:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The species' net charge. Assumed to be 0 if unspecified.
      checkfile:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The local path to the latest checkfile by Gaussian for the species.
      compute_thermo:
        type: bool | None
        doc_type: bool, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Whether to calculate thermodynamic properties for this species.
      thermo_at_own_level:
        type: bool
        doc_type: bool, optional
        has_default: true
        default: false
        default_is_literal: true
        default_repr: 'False'
        description: Relevant only when ``adaptive_levels`` are used. If ``True``, the species' thermochemistry
          is computed at its own size-appropriate (granular) adaptive level even when it participates in a reaction;
          the reaction's energetics then use a separate relabeled copy of the species evaluated at the reaction-consistent
          level. If ``False`` (default), the species itself is evaluated at the reaction-consistent (coarser) level
          and no copy is made.
      adaptive_lot_n_heavy:
        type: int | None
        doc_type: int
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: An internal override for adaptive-levels selection - the heavy-atom count to key the level
          by instead of this species' own count (set to the reaction-wide count for reaction participants). ``None``
          means use the species' own heavy-atom count.
        description_from: Attributes
      include_in_thermo_lib:
        type: bool | None
        doc_type: bool, optional
        has_default: true
        default: true
        default_is_literal: true
        default_repr: 'True'
        description: Whether to include in the output RMG library.
      consider_all_diastereomers:
        type: bool
        doc_type: bool, optional
        has_default: true
        default: true
        default_is_literal: true
        default_repr: 'True'
        description: Whether to consider all different chiralities (tetrahedral carbon centers, nitrogen inversions,
          and cis/trans double bonds) when generating conformers. ``True`` to consider all. If no 3D coordinates
          are given for the species, all diastereomers will be considered, otherwise the chirality specified by
          the given coordinates will be preserved.
      directed_rotors:
        type: dict | None
        doc_type: dict
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: 'Execute a directed internal rotation scan (i.e., a series of sp or constrained opt jobs) for
          the pivots of interest. The optional primary keys are: - ''brute_force_sp'' - ''brute_force_opt'' - ''cont_opt''
          - ''ess'' The brute force methods will generate all the geometries in advance and submit all relevant
          jobs simultaneously. The continuous method will wait for the previous job to terminate, and use its geometry
          as the initial guess for the next job. Another set of three keys is allowed, adding `_diagonal` to each
          of the above keys. the secondary keys are therefore: - ''brute_force_sp_diagonal'' - ''brute_force_opt_diagonal''
          - ''cont_opt_diagonal'' Specifying ''_diagonal'' will increment all the respective dihedrals together,
          resulting in a 1D scan instead of an ND scan. Values are nested lists. Each value is a list where the
          entries are either pivot lists (e.g., [1, 5]) or lists of pivot lists (e.g., [[1, 5], [6, 8]]), or a mix
          (e.g., [[4, 8], [[6, 9], [3, 4]]]). The requested directed scan type will be executed separately for each
          list entry in the value. A list entry that contains only two pivots will result in a 1D scan, while a
          list entry with N pivots will consider all of them, and will result in an ND scan if ''_diagonal'' is
          not specified. ARC will generate geometries using the ``rotor_scan_resolution`` argument in settings.py
          Note: An ''all'' string entry is also allowed in the value list, triggering a directed internal rotation
          scan for all torsions in the molecule. If ''all'' is specified within a second level list, then all the
          dihedrals will be considered together. Currently, ARC does not automatically identify torsions to be treated
          as ND, and this attribute must be specified by the user. An additional supported key is ''ess'', in which
          case ARC will allow the ESS to take care of spawning the ND continuous constrained optimizations (not
          yet implemented).'
      e0_only:
        type: bool
        doc_type: bool, optional
        has_default: true
        default: false
        default_is_literal: true
        default_repr: 'False'
        description: Whether to only run statmech (w/o thermo) to compute E0.
      external_symmetry:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The external symmetry of the species (not including rotor symmetries).
      fragments:
        type: list[list[int]] | None
        doc_type: list[list[int]] | None
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Fragments represented by this species, i.e., as in a VdW well or a TS. Entries are atom index
          lists of all atoms in a fragment, each list represents a different fragment.
      force_field:
        type: str
        doc_type: str, optional
        has_default: true
        default: MMFF94s
        default_is_literal: true
        default_repr: '''MMFF94s'''
        description: The force field to be used for conformer screening. The default is MMFF94s. Other optional
          force fields are MMFF94, UFF, or GAFF (the latter is slow). If 'fit' is specified for this parameter,
          some initial MMFF94s conformers will be generated, then force field parameters will be fitted for this
          molecule and conformers will be re-run with the fitted force field (recommended for drug-like species
          and species with many heteroatoms). Another option is specifying 'cheap', and the "old" RDKit embedding
          method will be used.
      inchi:
        type: str
        doc_type: str, optional
        has_default: true
        default: ''
        default_is_literal: true
        default_repr: ''''''
        description: An `InChI <https://www.inchi-trust.org/>`_ representation for the species 2D graph.
      is_ts:
        type: bool
        doc_type: bool, optional
        has_default: true
        default: false
        default_is_literal: true
        default_repr: 'False'
        description: Whether the species represents a transition state.
      irc_label:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The label of an original ``ARCSpecies`` object (a TS) for which an IRC job was spawned. The
          present species object instance represents a geometry optimization job of the IRC result in one direction.
      label:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The species label.
      mol:
        type: Molecule | None
        doc_type: Molecule, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: An ``RMG Molecule``. Atom order corresponds to the order in .initial_xyz
      multiplicity:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The species' electron spin multiplicity. Can be determined from the adjlist/smiles/xyz (If
          unspecified, assumed to be either a singlet or a doublet).
      multi_species:
        type: str | None
        doc_type: null
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: '(str, optional): The multi-species set this species belongs to. Used for running a set of
          species simultaneously in a single ESS input file. A species marked as multi_species will only have one
          conformer considered (n_confs set to 1).'
      number_of_radicals:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The number of radicals (inputted by the user, ARC won't attempt to determine it). Defaults
          to None. Important, e.g., if a Species is a bi-rad singlet, in which case the job should be unrestricted,
          but the multiplicity does not have the required information to make that decision (r vs. u).
      optical_isomers:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Whether (=2) or not (=1) the species has chiral center/s.
      preserve_param_in_scan:
        type: list | None
        doc_type: list, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Entries are length two iterables of atom indices (1-indexed) between which distances and dihedrals
          of these pivots must be preserved. Used for identification of rotors which break a TS.
      run_time:
        type: datetime.timedelta | int | float | None
        doc_type: timedelta | int | float, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Overall species execution time, an ``int``/``float`` is interpreted as seconds.
      rxn_label:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The reaction string (relevant for TSs).
      rxn_index:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The reaction index which is the respective key to the Scheduler rxn_dict.
      smiles:
        type: str
        doc_type: str, optional
        has_default: true
        default: ''
        default_is_literal: true
        default_repr: ''''''
        description: A `SMILES <https://en.wikipedia.org/wiki/Simplified_molecular-input_line-entry_system>`_ representation
          for the species 2D graph.
      species_dict:
        type: dict | None
        doc_type: dict, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: A dictionary to create this object from (used when restarting ARC).
      ts_number:
        type: int | None
        doc_type: int, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: An auto-generated number associating the TS ARCSpecies object with the corresponding :ref:`ARCReaction
          <reaction>` object.
      xyz:
        type: list | dict | str | None
        doc_type: list, str, dict, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Entries are either string-format coordinates, file paths, or ARC's dict format. (If there's
          only one entry, it could be given directly, not in a list). The file paths could direct to either a .xyz
          file, ARC conformers (w/ or w/o energies), or an ESS log/input files.
      yml_path:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: Path to an Arkane YAML file representing a species (for loading the object).
      keep_mol:
        type: bool
        doc_type: bool
        has_default: true
        default: false
        default_is_literal: true
        default_repr: 'False'
        description: Label to prevent the generation of a new Molecule object.
        description_from: Attributes
      project_directory:
        type: str | None
        doc_type: str, optional
        has_default: true
        default: null
        default_is_literal: true
        default_repr: None
        description: The path to the project directory.
