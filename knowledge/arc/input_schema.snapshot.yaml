        default_is_literal: true
        default_repr: '''p'''
        description: 'The bond additivity correction type. ''p'' for Petersson- or ''m'' for Melius-type BAC. Default:
          ''p''. ``None`` to not use BAC.'
      bath_gas:
        type: str | None
