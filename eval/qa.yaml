# Retrieval test set for `rag-drg eval` (see docs/evaluation.md).
#
# Each item is a question as an agent or group member would ask it, and the document(s) that
# answer it. A question passes if any `expect` entry matches one of the top-k results.
#   expect:    "source:path/prefix" strings, or {source, path, title_contains} mappings
#   filters:   optional search filters (software, version, domain, doc_type, source), used only
#              when the asker would plausibly have passed them
#   requires:  sources that must be indexed; default = the sources named in `expect`.
#              Items whose sources are missing are skipped (CI indexes only curated + lessons).
#   tags:      software/topic tags, plus `paraphrase` for questions that share few or no keywords
#              with the answer (these measure what embeddings add).
#
# Every expectation was checked by hand against the indexed text. Write new questions the way a
# person would ask them; do not reword a question until it passes.

# ------------------------------------------------------------------------------------ ORCA
- id: orca-maxcore
  q: "Is ORCA %maxcore total memory or per core?"
  filters: {software: orca}
  expect: ["curated:ess/orca/orca-essentials.md"]
  tags: [orca, memory]

- id: orca-mpirun
  q: "Do I need to launch ORCA with mpirun when I use %pal nprocs 16?"
  expect: ["curated:ess/orca/orca-essentials.md", "curated:hpc/templates/slurm_orca.sh"]
  tags: [orca, hpc]

- id: orca-moread
  q: "How do I read orbitals from a previous .gbw file in ORCA?"
  filters: {software: orca}
  expect: ["curated:ess/orca/orca-essentials.md"]
  tags: [orca, restart]

- id: orca-old-grids
  q: "My old ORCA 4 input with Grid4 FinalGrid5 fails in ORCA 5, what replaced those keywords?"
  expect: ["curated:ess/orca/orca-essentials.md"]
  tags: [orca, dft]

