name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[mcp,dev]'
      - name: Lint knowledge cards and lessons
        run: rag-drg lint
      - name: Unit tests
        run: pytest -q
      - name: Index the curated knowledge (smoke test)
        run: |
          rag-drg ingest --source curated --source lessons --no-embed
          rag-drg search "ORCA maxcore" --k 1
      # Retrieval quality on eval/qa.yaml against the curated index built above. Items whose
      # expected answers live in ARC/Psi4/PySCF (not fetched here) are skipped automatically, so
      # this is deterministic: upstream repos are unpinned and would make CI fail on their
      # commits rather than ours. Run the full set locally or on the server (docs/evaluation.md).
      - name: Retrieval eval (curated subset)
        run: rag-drg eval --min-hit-rate 0.9 --show-failures
